services:
  # ----- Python crawler (scheduled jobs that write to PostgreSQL) -----
  crawler:
    build:
      context: .
      dockerfile: Dockerfile
    image: sunset-crawler:local
    container_name: sunset-crawler
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./env_config.yml:/app/env_config.yml:ro
    environment:
      TZ: Asia/Taipei
    networks:
      - sunset

  # ----- Rust read-only API (consumed by the frontend / cloudflared) -----
  sunset-api:
    image: ghcr.io/futaguard/sunset-api:latest
    pull_policy: always
    container_name: sunset-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./env_config.yml:/app/env_config.yml:ro
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      TZ: Asia/Taipei
    expose:
      - "8080"
    # ports:
    #   - "8080:8080"
    networks:
      - sunset
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----- Cloudflare Tunnel (public ingress for sunset-api) -----
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sunset-cloudflared
    restart: unless-stopped
    # Public Hostname in the CF dashboard should point at http://sunset-api:8080
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    environment:
      TUNNEL_METRICS: 0.0.0.0:2000
    depends_on:
      sunset-api:
        condition: service_started
    networks:
      - sunset

networks:
  sunset:
    driver: bridge
