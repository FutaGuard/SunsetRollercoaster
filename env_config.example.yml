database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  # Alembic automatically renames the legacy taiwanreservoir database.
  name: sunset

# Apps Script Web App (apps-script/finance) serving GOOGLEFINANCE exchange rates.
# Used by the Python crawler and sunset-api. Keep the real URL out of the repo.
finance:
  exchange_rate_url: https://script.google.com/macros/s/<deployment-id>/exec

# Optional. sunset-api fetches these counties' fire dispatch case lists through a
# URL-prefix proxy (`<proxy_url>/<source url>`, same as the Apps Script PROXY_URL),
# for sites that refuse the API host's network. Keep the real URL out of the repo.
fire_dispatch:
  proxy_url: https://<proxy-host>
  proxy_basic_auth: user:password
  proxy_counties: [kaohsiung, hsinchu-city, chiayi-city]

# sunset-api as reached by the Python crawler, which stores /fire-dispatch/latest
# into fire_dispatch_record every minute. In docker-compose: the service name and
# the server.port below.
sunset_api:
  url: http://sunset-api:8080

# Optional. Consumed only by sunset-api (Rust). Defaults: 0.0.0.0:8080.
server:
  host: 0.0.0.0
  port: 8080
